name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"  # e.g. v0.1.0, v0.2.0rc1

permissions:
  contents: read

env:
  UV_LOCKED: 1  # Ensure lockfile is up to date at build time

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs needs tags and history to work out the version
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false  # Don't risk a poisoned cache in release builds
      - run: uv build
      # Catches tags that aren't normalised PEP 440 versions, e.g. v0.2.0-rc1
      - name: Check built version matches tag
        run: |
          if [ ! -f "dist/sphinx_eu_ai_label-${GITHUB_REF_NAME#v}.tar.gz" ]; then
            echo "::error::Built version does not match tag ${GITHUB_REF_NAME}:"
            ls dist/
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    # Must match the environment configured for the trusted publisher on PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/sphinx-eu-ai-label/

    permissions:
      id-token: write  # For PyPI trusted publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - run: uv publish
