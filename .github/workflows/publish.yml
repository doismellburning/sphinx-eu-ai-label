name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  UV_LOCKED: 1  # Ensure lockfile is up to date at build time

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false  # Don't risk a poisoned cache in release builds
      - name: Check tag matches package version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    # Must match the environment configured for the trusted publisher on PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/sphinx-eu-ai-label/

    permissions:
      id-token: write  # For PyPI trusted publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - run: uv publish
