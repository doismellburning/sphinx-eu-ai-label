name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: 1  # Ensure lockfile is up to date at test time

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make bootstrap
      - run: make check
      # For the test that compiles LaTeX output to PDF
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            latexmk tex-gyre texlive-fonts-recommended texlive-latex-extra texlive-latex-recommended
      - run: make test
