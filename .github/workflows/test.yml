name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest

    # Test the oldest and newest supported Python, each with the locked dependencies, the oldest supported Sphinx,
    # and everything upgraded to its latest release
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
        dependencies: ["locked", "sphinx-8.0", "latest"]

    name: test (Python ${{ matrix.python }}, ${{ matrix.dependencies }})

    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_NO_SYNC: 1  # Keep the dependencies installed below, rather than syncing back to the lockfile

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv lock --check  # Ensure lockfile is up to date at test time
      - run: make bootstrap
      - if: matrix.dependencies == 'sphinx-8.0'
        run: uv pip install "sphinx~=8.0.0"
      - if: matrix.dependencies == 'latest'
        run: uv sync --dev --upgrade
      - run: uv run python -c "import sphinx; print(sphinx.__version__)"
      - run: make check
      # For the test that compiles LaTeX output to PDF
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            latexmk tex-gyre texlive-fonts-recommended texlive-latex-extra texlive-latex-recommended
      - run: make test

  # A single check for branch protection to require, which passes only if every matrix job does
  test:
    if: always()
    needs: matrix
    runs-on: ubuntu-latest

    steps:
      - run: test "${{ needs.matrix.result }}" = success
