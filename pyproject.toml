[project]
name = "sphinx-eu-ai-label"
version = "0.1.0"
readme = "README.md"
description = "Sphinx extension for adding the European Commission's AI-generated content labels to documentation"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Kristian Glass" },
]
keywords = [
    "sphinx",
    "sphinx-extension",
    "documentation",
    "ai",
    "ai-act",
    "eu",
    "label",
    "transparency",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
    "Typing :: Typed",
]
dependencies = [
    "sphinx>=8",
]

[project.urls]
Homepage = "https://github.com/doismellburning/sphinx-eu-ai-label"
Documentation = "https://doismellburning.github.io/sphinx-eu-ai-label/"
Source = "https://github.com/doismellburning/sphinx-eu-ai-label"
Issues = "https://github.com/doismellburning/sphinx-eu-ai-label/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
dynamic_context = "test_function"

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.coverage.html]
show_contexts = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
	"F",  # pyflakes
	"E", "W",  # pycodestyle
	"C90",  # mccabe
	"I",  # isort
	"N",  # pep8-naming
	"UP",  # pyupgrade
	"B",  # flake8-bugbear
	"INP",  # flake8-no-pep420
	"PLC0415",
	"TID253",
	"RUF",  # Ruff-specific rules
	"PT",  # flake8-pytest-style
	"SIM",  # flake8-simplify
	"PERF",  # Perflint
	"LOG",  # flake8-logging
]

[tool.ruff.lint.per-file-ignores]
"test/roots/**" = ["INP001"]
"docs/conf.py" = ["INP001"]
"scripts/**" = ["INP001"]

[tool.ty.src]
# Scripts declare their own dependencies inline, which aren't in the project environment
exclude = ["scripts"]

[dependency-groups]
dev = [
    "beautifulsoup4",
    "coverage",
    "myst-parser",
    "pytest",
    "ruff",
    "ty",
]
docs = [
    "myst-parser",
    "sphinx",
]

[tool.uv]
default-groups = ["dev", "docs"]
